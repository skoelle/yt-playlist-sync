# Example only. Replace the placeholders with your own values and keep real
# values (channel, ping URLs, paths) out of the public repository (.env is git-ignored).
services:
  yt-playlist-sync:
    image: ghcr.io/skoelle/yt-playlist-sync:latest
    container_name: yt-playlist-sync
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      PUID: "1000"
      PGID: "1000"
      YOUTUBE_CHANNEL: "${YOUTUBE_CHANNEL:-@beispielkanal}"
      ONESHOT_KEYWORD: "${ONESHOT_KEYWORD:-setlist}"
      DISCOVERY_INTERVAL_MIN: "50"
      DISCOVERY_INTERVAL_MAX: "70"
      SYNC_CRON: "0 3 * * *"
      SYNC_JITTER: "30"
      HC_DISCOVERY_URL: "${HC_DISCOVERY_URL:-}"
      HC_SYNC_URL: "${HC_SYNC_URL:-}"
      BACKUP_KEEP: "7"
      DRY_RUN: "${DRY_RUN:-0}"
    volumes:
      - /srv/docker/yt-playlist-sync/config:/config   # local disk, NOT NFS (SQLite)
      - /srv/docker/yt-playlist-sync/backup:/backup   # nightly backups (database + download archives)
      - <nas>/media/yt-playlists:/data             # example path of the target share
    ports:
      - "8048:8048"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # One-shot TubeArchivist export – see README, "Exporting from TubeArchivist".
  # Start with: docker compose run --rm ta-export --dry-run
  # ta-export:
  #   image: ghcr.io/skoelle/yt-playlist-sync:latest
  #   environment:
  #     PUID: "1000"
  #     PGID: "1000"
  #     TA_API_URL: "http://<tubearchivist-host>:8770"
  #     TA_API_HOST: "<allowed-host-header>"
  #     TA_API_TOKEN: "<token>"
  #     TA_MEDIA_ROOT: /ta
  #     TA_EXPORT_TARGET: /export
  #   volumes:
  #     - /srv/tubearchivist:/ta:ro   # TubeArchivist data (media/ + cache/), read-only
  #     - /srv/export:/export         # export target (hardlink only if the filesystem allows it)
  #   command: ["python", "-m", "app.ta_export", "--dry-run"]

  # One-shot TubeSync export – see README, "Exporting from TubeSync".
  # Start with: docker compose run --rm ts-export --dry-run
  # ts-export:
  #   image: ghcr.io/skoelle/yt-playlist-sync:latest
  #   environment:
  #     PUID: "1000"
  #     PGID: "1000"
  #     TS_DB: /ta/config/db.sqlite3
  #     TS_MEDIA_ROOT: /ta/downloads
  #     TS_THUMBS_ROOT: /ta/config/media
  #     TS_EXPORT_TARGET: /export
  #   volumes:
  #     - /srv/tubesync:/ta:ro        # TubeSync data (config/ + downloads/), read-only
  #     - /srv/export:/export         # export target (hardlink only if the filesystem allows it)
  #   command: ["python", "-m", "app.ts_export", "--dry-run"]

  # One-shot import of an exported tree (stop the main service first) – see README,
  # "Importing the exported tree".
  # Start with: docker compose run --rm ta-import --dry-run
  # ta-import:
  #   image: ghcr.io/skoelle/yt-playlist-sync:latest
  #   environment:
  #     PUID: "1000"
  #     PGID: "1000"
  #   volumes:
  #     - /srv/docker/yt-playlist-sync/config:/config   # database + archives live here
  #     - <nas>/media/yt-playlists:/data             # playlist folders (with manifest.json)
  #     - /srv/export:/export:ro                        # optional: scan before moving folders
  #   command: ["python", "-m", "app.ta_import", "--source", "/export", "--dry-run"]
